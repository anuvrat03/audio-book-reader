<!DOCTYPE html>
<html>
<head>
  <title>My Mobile Audiobook Reader</title>
  <style>
    /* Makes the screen clean and readable on mobile */
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    
    /* Input box for text */
    textarea { width: 100%; height: 180px; font-size: 16px; margin-bottom: 15px; }
    
    /* Dropdown menus for selecting voice options */
    select { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 15px; border-radius: 6px; }
    
    /* Action buttons */
    button { padding: 15px 25px; font-size: 18px; margin-right: 10px; border-radius: 8px; border: none; }
    .play-btn { background-color: #28a745; color: white; }
    .stop-btn { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

  <h2>My Audiobook Reader (Hindi Supported)</h2>
  
  <!-- Text area where you paste your Hindi text -->
  <textarea id="documentText" placeholder="यहाँ अपना हिंदी टेक्स्ट पेस्ट करें... (Paste your Hindi text here)"></textarea>

  <!-- Dropdown to select available Hindi / Indian voices on your phone -->
  <label for="voiceSelect"><strong>Select Hindi / Local Voice:</strong></label>
  <select id="voiceSelect"></select>

  <!-- Pitch dropdown to help adjust tone between higher (Female) and deeper (Male) -->
  <label for="pitchSelect"><strong>Voice Tone (Pitch):</strong></label>
  <select id="pitchSelect">
    <option value="1">Normal Tone</option>
    <option value="1.3">Higher Pitch (Female / Light Voice)</option>
    <option value="0.7">Deeper Pitch (Male / Deep Voice)</option>
  </select>

  <br><br>
  
  <!-- Buttons to control playback -->
  <button class="play-btn" onclick="startReading()">Play</button>
  <button class="stop-btn" onclick="stopReading()">Stop</button>

  <script>
    // Connects to phone's speech engine
    let speech = new SpeechSynthesisUtterance();
    let voices = [];
    let voiceSelect = document.getElementById("voiceSelect");
    let pitchSelect = document.getElementById("pitchSelect");

    // Load available voices from device and filter for Hindi (hi-IN) or Indian English
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';

      // Filter specifically for Hindi or Indian accents available on phone
      let hindiVoices = voices.filter(v => v.lang.includes('hi') || v.lang.includes('IN'));

      // If no specific Hindi voice is found, show all available device voices
      let displayList = hindiVoices.length > 0 ? hindiVoices : voices;

      displayList.forEach((voice) => {
        let option = document.createElement('option');
        option.value = voice.name;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });
    }

    // Trigger voice loader
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    // Play action
    function startReading() {
      let text = document.getElementById("documentText").value;
      
      if (text.trim() === "") {
        alert("Please paste some text first!");
        return;
      }
      
      window.speechSynthesis.cancel();
      
      speech.text = text;
      
      // Assign selected voice from dropdown
      let selectedVoiceName = voiceSelect.value;
      speech.voice = voices.find(v => v.name === selectedVoiceName);
      
      // Set pitch adjustment selected by user
      speech.pitch = parseFloat(pitchSelect.value);
      
      // Speak text
      window.speechSynthesis.speak(speech);
    }

    // Stop action
    function stopReading() {
      window.speechSynthesis.cancel();
    }
  </script>

</body>
</html>
