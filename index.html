<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Mobile Audiobook Reader</title>
  <style>
    /* Keeps design clean on phone screens */
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    textarea { width: 100%; height: 180px; font-size: 16px; margin-bottom: 15px; }
    select { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 15px; border-radius: 6px; }
    button { padding: 15px 25px; font-size: 18px; margin-right: 10px; border-radius: 8px; border: none; }
    .play-btn { background-color: #28a745; color: white; }
    .stop-btn { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

  <h2>My Audiobook Reader</h2>
  
  <!-- The box placeholder is now set back to plain English -->
  <textarea id="documentText" placeholder="Paste your document text here..."></textarea>

  <!-- Dropdown to choose any available voice (including Hindi) -->
  <label for="voiceSelect"><strong>Choose Voice:</strong></label>
  <select id="voiceSelect"></select>

  <!-- Pitch selector to adjust tone -->
  <label for="pitchSelect"><strong>Voice Pitch:</strong></label>
  <select id="pitchSelect">
    <option value="1">Default Pitch</option>
    <option value="1.3">Higher Pitch (Female style)</option>
    <option value="0.7">Deeper Pitch (Male style)</option>
  </select>

  <br><br>
  
  <button class="play-btn" onclick="startReading()">Play</button>
  <button class="stop-btn" onclick="stopReading()">Stop</button>

  <script>
    let speech = new SpeechSynthesisUtterance();
    let voices = [];
    let voiceSelect = document.getElementById("voiceSelect");
    let pitchSelect = document.getElementById("pitchSelect");

    // Load available voices from phone engine into the dropdown menu
    function loadVoices() {
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';

      // Populate dropdown with all available system voices
      voices.forEach((voice, index) => {
        let option = document.createElement('option');
        option.value = index;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });
    }

    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    function startReading() {
      let text = document.getElementById("documentText").value;
      if (text.trim() === "") {
        alert("Please paste text first!");
        return;
      }
      
      window.speechSynthesis.cancel();
      
      speech.text = text;
      
      let selectedIndex = voiceSelect.value;
      if (voices[selectedIndex]) {
        speech.voice = voices[selectedIndex];
      }
      
      speech.pitch = parseFloat(pitchSelect.value);
      window.speechSynthesis.speak(speech);
    }

    function stopReading() {
      window.speechSynthesis.cancel();
    }
  </script>

</body>
</html>
