<!DOCTYPE html>
<html>
<head>
  <title>My Mobile Audiobook Reader</title>
  <style>
    /* Keeps the app clean and easy to read on your mobile screen */
    body { font-family: sans-serif; padding: 20px; background-color: #f4f4f9; }
    
    /* Styles the document text area */
    textarea { width: 100%; height: 180px; font-size: 16px; margin-bottom: 15px; }
    
    /* Styles the voice dropdown menu */
    select { width: 100%; padding: 12px; font-size: 16px; margin-bottom: 15px; border-radius: 6px; }
    
    /* Large buttons made easy to tap on your Samsung phone */
    button { padding: 15px 25px; font-size: 18px; margin-right: 10px; border-radius: 8px; border: none; }
    .play-btn { background-color: #28a745; color: white; }
    .stop-btn { background-color: #dc3545; color: white; }
  </style>
</head>
<body>

  <h2>My Audiobook Reader</h2>
  
  <!-- Text area for pasting document text -->
  <textarea id="documentText" placeholder="Paste your document text here..."></textarea>

  <!-- Dropdown menu to choose different voices -->
  <label for="voiceSelect"><strong>Choose Voice:</strong></label>
  <select id="voiceSelect"></select>
  
  <br><br>
  
  <!-- Play and Stop buttons -->
  <button class="play-btn" onclick="startReading()">Play</button>
  <button class="stop-btn" onclick="stopReading()">Stop</button>

  <script>
    // Create connection to your phone's speech engine
    let speech = new SpeechSynthesisUtterance();
    let voices = [];
    let voiceSelect = document.getElementById("voiceSelect");

    // Function to load all available voices from your phone into the dropdown menu
    function loadVoices() {
      // Fetch available voices from your device
      voices = window.speechSynthesis.getVoices();
      voiceSelect.innerHTML = '';

      // Loop through each voice and add it as an option in the menu
      voices.forEach((voice, i) => {
        let option = document.createElement('option');
        option.value = i;
        option.textContent = `${voice.name} (${voice.lang})`;
        voiceSelect.appendChild(option);
      });
    }

    // Load voices immediately and whenever phone voice list updates
    loadVoices();
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = loadVoices;
    }

    // Function that runs when you tap the green Play button
    function startReading() {
      let text = document.getElementById("documentText").value;
      
      if (text.trim() === "") {
        alert("Please paste some text first!");
        return;
      }
      
      // Stop any current reading before starting
      window.speechSynthesis.cancel();
      
      // Assign text to speech engine
      speech.text = text;
      
      // Set chosen voice from the dropdown menu
      let selectedVoiceIndex = voiceSelect.value;
      if (voices[selectedVoiceIndex]) {
        speech.voice = voices[selectedVoiceIndex];
      }
      
      // Speak the text out loud
      window.speechSynthesis.speak(speech);
    }

    // Function that runs when you tap the red Stop button
    function stopReading() {
      window.speechSynthesis.cancel();
    }
  </script>

</body>
</html>
